<!doctype html>
<html lang="en">
  <head>
    <!-- Use UTF-8 to display text and symbols correctly. -->
    <meta charset="UTF-8" />

    <!-- Match the page width to the device screen. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Describe the application for search engines. -->
    <meta
      name="description"
      content="Search movies, explore their details, and save your favourites."
    />

    <!-- Display the application icon in the browser tab. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Set the text displayed in the browser tab. -->
    <title>MovieFinder</title>
  </head>

  <body>
    <!-- Provide the element where React mounts the application. -->
    <div id="root"></div>

    <!-- Load the React entry file as a JavaScript module. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
